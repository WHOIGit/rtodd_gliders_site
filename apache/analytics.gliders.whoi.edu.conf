# Apache vhost for the GoatCounter analytics service.
#
# This is a REFERENCE COPY kept in the repo for documentation. The live file
# is on the `racing` host at:
#     /etc/apache2/sites-available/analytics.gliders.whoi.edu.conf
# enabled with `a2ensite analytics.gliders.whoi.edu` and a reload of apache2.
#
# It reverse-proxies analytics.gliders.whoi.edu to the goatcounter container,
# which listens HTTP-only on loopback 127.0.0.1:8051 (see compose.yml).
#
# mod_proxy, mod_proxy_http and mod_headers must be enabled (they already are,
# since the main gliders.whoi.edu vhost uses ProxyPass / RequestHeader).

# Push port 80 traffic to 443
<VirtualHost *:80>
    ServerName analytics.gliders.whoi.edu
    <IfModule mod_rewrite.c>
        RewriteEngine on
        RewriteCond %{HTTPS} !=on
        RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R,L]
    </IfModule>
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName analytics.gliders.whoi.edu
    ServerAdmin rtodd@whoi.edu

    ErrorLog  ${APACHE_LOG_DIR}/analytics_error.log
    CustomLog ${APACHE_LOG_DIR}/analytics_access.log combined

    SSLEngine on
    # Shared Let's Encrypt cert — must include analytics.gliders.whoi.edu as a
    # SAN (expand the certbot lineage if it currently covers only the apex).
    SSLCertificateFile    /etc/letsencrypt/live/gliders.whoi.edu/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/gliders.whoi.edu/privkey.pem

    # Reverse proxy to the goatcounter container (loopback :8051).
    # ProxyPreserveHost On is REQUIRED: GoatCounter matches the incoming Host
    # header against the site vhost; without it the host becomes 127.0.0.1
    # and GoatCounter returns "no such site".
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
    ProxyPass        /  http://127.0.0.1:8051/  retry=0
    ProxyPassReverse /  http://127.0.0.1:8051/
</VirtualHost>
</IfModule>
