# gliders.whoi.edu — Dash app at /, static /data/ tree served from disk.

# Push all port 80 traffic to 443.
<VirtualHost *:80>
    ServerAdmin rtodd@whoi.edu
    ServerName gliders.whoi.edu
    DocumentRoot /var/www/gliders.whoi.edu

    <IfModule mod_rewrite.c>
        RewriteEngine on
        RewriteCond %{HTTPS} !=on
        RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R,L]
    </IfModule>
</VirtualHost>

<IfModule mod_ssl.c>
    <VirtualHost _default_:443>
        ServerAdmin rtodd@whoi.edu
        ServerName gliders.whoi.edu
        DocumentRoot /var/www/gliders.whoi.edu

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined

        SSLEngine on
        SSLCertificateFile    /etc/letsencrypt/live/gliders.whoi.edu/fullchain.pem
        SSLCertificateKeyFile /etc/letsencrypt/live/gliders.whoi.edu/privkey.pem

        # Browser hardening headers.
        Header always set Strict-Transport-Security "max-age=31536000"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

        # Static data tree — NOT part of the Dash app or WordPress, but the
        # Dash app references files under it. Served straight from disk.
        <Directory /var/www/gliders.whoi.edu/data>
            Options +Indexes
            IndexOptions FancyIndexing
            IndexOrderDefault Descending Date
            Require all granted
        </Directory>

        # --- Dash app served at / (WordPress retired) ---
        ProxyPreserveHost On
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Host "%{Host}e" env=Host
        RequestHeader set X-Forwarded-Port "443"

        # Retired WordPress paths. Return 410 Gone so crawlers and scanners do
        # not treat the old CMS surface as a live part of the site.
        RedirectMatch 410 ^/wp-admin(/.*)?$
        RedirectMatch 410 ^/wp-content(/.*)?$
        RedirectMatch 410 ^/wp-includes(/.*)?$
        RedirectMatch 410 ^/wp-login\.php$
        RedirectMatch 410 ^/xmlrpc\.php$

        # Keep /data/ served from disk — exclude it from any proxy rules.
        ProxyPass /data  !
        ProxyPass /data/ !

        # Dash runtime endpoints and app-served assets.
        ProxyPass /_dash-component-suites/ http://127.0.0.1:8050/_dash-component-suites/ retry=0
        ProxyPass /_dash-layout           http://127.0.0.1:8050/_dash-layout retry=0
        ProxyPass /_dash-dependencies     http://127.0.0.1:8050/_dash-dependencies retry=0
        ProxyPass /_dash-update-component http://127.0.0.1:8050/_dash-update-component retry=0
        ProxyPass /_reload-hash           http://127.0.0.1:8050/_reload-hash retry=0
        ProxyPass /_favicon.ico           http://127.0.0.1:8050/_favicon.ico retry=0
        ProxyPass /assets/                http://127.0.0.1:8050/assets/ retry=0
        ProxyPass /config-assets/         http://127.0.0.1:8050/config-assets/ retry=0

        # Public Dash page routes. Keep this as an allowlist so unknown paths
        # fall through to Apache's normal 404 instead of returning the Dash app
        # shell with HTTP 200.
        ProxyPassMatch ^/$                                           http://127.0.0.1:8050/
        ProxyPassMatch ^/(datapage|people|publications)/?$           http://127.0.0.1:8050/$1
        ProxyPassMatch ^/plotting/(realtime|archived|profiles|engineering)/?$ http://127.0.0.1:8050/plotting/$1

        ProxyPassReverse /  http://127.0.0.1:8050/
    </VirtualHost>
</IfModule>
