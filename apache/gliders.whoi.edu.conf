# gliders.whoi.edu — Dash app at /, static /data/ tree served from disk.

# Push all port 80 traffic to 443.
<VirtualHost *:80>
    ServerAdmin rtodd@whoi.edu
    ServerName gliders.whoi.edu
    DocumentRoot /var/www/gliders.whoi.edu

    <IfModule mod_rewrite.c>
        RewriteEngine on
        RewriteCond %{HTTPS} !=on
        RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R,L]
    </IfModule>
</VirtualHost>

<IfModule mod_ssl.c>
    <VirtualHost _default_:443>
        ServerAdmin rtodd@whoi.edu
        ServerName gliders.whoi.edu
        DocumentRoot /var/www/gliders.whoi.edu

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined

        SSLEngine on
        SSLCertificateFile    /etc/letsencrypt/live/gliders.whoi.edu/fullchain.pem
        SSLCertificateKeyFile /etc/letsencrypt/live/gliders.whoi.edu/privkey.pem

        # Static data tree — NOT part of the Dash app or WordPress, but the
        # Dash app references files under it. Served straight from disk.
        <Directory /var/www/gliders.whoi.edu/data>
            Options +Indexes
            IndexOptions FancyIndexing
            IndexOrderDefault Descending Date
            Require all granted
        </Directory>

        # --- Dash app served at / (WordPress retired) ---
        ProxyPreserveHost On
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Host "%{Host}e" env=Host
        RequestHeader set X-Forwarded-Port "443"

        # Keep /data/ served from disk — exclude it from the proxy.
        # (Exclusions must come before the catch-all ProxyPass below.)
        ProxyPass /data  !
        ProxyPass /data/ !

        # Reverse proxy everything else to the Dash backend (gunicorn on :8050).
        ProxyPass        /  http://127.0.0.1:8050/  retry=0
        ProxyPassReverse /  http://127.0.0.1:8050/
    </VirtualHost>
</IfModule>
