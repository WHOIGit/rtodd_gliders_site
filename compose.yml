services:
  data-watcher:
    image: gliderapp:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "src/data_watcher.py"]
    user: "168998:168997"          # gliderapp service account
    volumes:
      - /srv/data/sync:/app/data/sync:ro
      - /srv/data/netcdf:/app/data/netcdf:rw
    restart: unless-stopped
    env_file:
      - path: prod.env
        required: true
    environment:
      - PYTHONUNBUFFERED=1

  gliderapp:
    image: gliderapp:latest
    container_name: gliderapp
    user: "168998:168997"          # gliderapp service account
    ports:
      - "8050:8050"
    restart: unless-stopped
    env_file:
      - path: prod.env
        required: true
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - /srv/data:/app/data:ro
      - ./config:/app/config:ro
    #  - ./src:/app/src:ro
    # uncomment for local development

  goatcounter:
    image: arp242/goatcounter:latest
    container_name: goatcounter
    user: "168998:168997"          # gliderapp service account
    # Apache (analytics.gliders.whoi.edu vhost) terminates TLS and proxies
    # plain HTTP to this container, so GoatCounter listens HTTP-only.
    # -automigrate applies pending schema migrations on startup.
    # -email-from must be set explicitly: the container runs as a uid not in
    # its /etc/passwd (see `user:` below), so GoatCounter cannot derive the
    # default sender from the OS user and would panic on startup.
    command:
      - serve
      - -listen=:8080
      - -automigrate
      - -tls=none
      - -email-from=goatcounter@gliders.whoi.edu
    ports:
      # bound to loopback only — reachable solely via the Apache reverse proxy
      - "127.0.0.1:8051:8080"
    volumes:
      # SQLite database lives here; survives container recreation
      - /srv/data/analytics:/home/goatcounter/goatcounter-data
    restart: unless-stopped
