services:
  data-watcher:
    image: gliderapp:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "src/data_watcher.py"]
    volumes:
      - ./data/sync:/app/data/sync:ro
      - ./data/netcdf:/app/data/netcdf:rw
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1

  gliderapp:
    image: gliderapp:latest
    container_name: gliderapp
    ports:
      - "8050:8050"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - PROD=1
      - DEBUG=0
    volumes:
      - ./data:/app/data:ro
      - ./config:/app/config:ro
    #  - ./src:/app/src:ro
    # uncomment for local development
